name: ci
# Third-party actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
on:
  push: {branches: [main], tags: ["v*"]}
  pull_request:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: {matrix: {python: ["3.11", "3.12"]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check meridian tests
      - run: pytest -q
      - run: python -m meridian rules --check
      - run: python -m meridian demo
      - run: python scripts/check_hcl.py
      - name: generated docs are up to date
        run: |
          python scripts/gen_reference_docs.py && python scripts/gen_mcp_docs.py && python scripts/gen_adx_schema.py
          git diff --exit-code -- docs/design docs/MCP-TOOLS.md infra/azure/adx-schema.kql
      - run: python scripts/cost_model.py
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: meridian, POSTGRES_PASSWORD: meridian-ci, POSTGRES_DB: meridian}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env: {MERIDIAN_TEST_PG: "postgresql+psycopg://meridian:meridian-ci@127.0.0.1:5432/meridian"}
  lodestar-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          repository: manabouprj/Lodestar
          path: lodestar
          persist-credentials: false
          # The default token cannot read another private repository. Add a fine-grained, read-only token for
          # manabouprj/Lodestar as the secret LODESTAR_READ_TOKEN to run this contract test; without it the test skips.
          token: ${{ secrets.LODESTAR_READ_TOKEN || github.token }}
        continue-on-error: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_lodestar_contract.py
        env: {LODESTAR_PATH: "${{ github.workspace }}/lodestar"}
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: {matrix: {cloud: [azure, aws]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      - run: terraform fmt -check -recursive
        working-directory: infra/${{ matrix.cloud }}
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/${{ matrix.cloud }}
      - run: terraform test        # offline plan with mocked providers (tests/plan.tftest.hcl)
        working-directory: infra/${{ matrix.cloud }}
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - run: docker build -t meridian:ci .
      - run: docker run --rm meridian:ci rules --check
      - name: vulnerability scan (fails on fixable critical findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with: {image-ref: "meridian:ci", format: table, severity: CRITICAL, ignore-unfixed: true, exit-code: "1"}
      - name: software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with: {image-ref: "meridian:ci", format: cyclonedx, output: sbom.cdx.json, skip-setup-trivy: true}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with: {name: sbom, path: sbom.cdx.json, retention-days: 90}
