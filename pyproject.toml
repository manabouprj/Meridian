[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-security"
version = "1.0.1"
description = "MERIDIAN - SIEM-less detection, investigation and response with AI agents over MCP (Microsoft Foundry / Amazon Bedrock)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30", "pydantic>=2.8,<3", "pyyaml>=6.0", "jinja2>=3.1", "httpx>=0.27",
  "python-multipart>=0.0.9", "pyjwt[crypto]>=2.8", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "duckdb>=1.2", "pyarrow>=17",
  "pytz", "fastavro>=1.9", "mcp>=2.2,<3", "anthropic>=1.10", "boto3>=1.35", "azure-identity>=1.17",
  "azure-storage-blob>=12.20", "azure-storage-queue>=12.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "python-hcl2>=4.3"]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.setuptools.package-data]
meridian = ["web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E702", "B008", "E501"]
