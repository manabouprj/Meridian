<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="544" viewBox="0 0 1280 544" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Ingestion flow - SaaS API pull (Microsoft 365 Management Activity)</title><desc id="d">The API collector pulls from SaaS APIs on a schedule and lands the results like any other batch.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect width="1280" height="544" fill="#ffffff"/>
<text x="32" y="40" font-size="20" font-weight="750" fill="#1f2328" text-anchor="start" xml:space="preserve">Ingestion flow - SaaS API pull (Microsoft 365 Management Activity)</text>
<rect x="12.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="90.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">MERIDIAN</text>
<text x="90.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">collector</text>
<line x1="90.0" y1="98" x2="90.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="287.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="365.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Store</text>
<text x="365.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">(cursor)</text>
<line x1="365.0" y1="98" x2="365.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="562.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="640.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Entra ID</text>
<text x="640.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">(token)</text>
<line x1="640.0" y1="98" x2="640.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="837.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="915.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Microsoft 365</text>
<text x="915.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">API</text>
<line x1="915.0" y1="98" x2="915.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="1112.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="1190.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Landing</text>
<text x="1190.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">zone</text>
<line x1="1190.0" y1="98" x2="1190.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M90.0,128 L361.0,128" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="227.5" y="121" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">lease lock held; source due (interval); read cursor</text>
<path d="M90.0,174 L636.0,174" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="365.0" y="167" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">client credentials (secret from Key Vault / Secrets Manager)</text>
<path d="M640.0,220 L94.0,220" fill="none" stroke="#6e7781" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="365.0" y="213" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">access token (cached until expiry)</text>
<path d="M90.0,266 L911.0,266" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="502.5" y="259" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">GET content?contentType=Audit.General&amp;startTime={cursor}&amp;endTime={end}</text>
<path d="M915.0,312 L94.0,312" fill="none" stroke="#6e7781" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="502.5" y="305" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">list of content blobs + NextPageUri</text>
<path d="M90.0,358 L911.0,358" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="502.5" y="351" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">GET each contentUri (two-step API)</text>
<path d="M90.0,404 L1186.0,404" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="640.0" y="397" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">batches of up to 10,000 records (JSON lines, gzip)</text>
<path d="M90.0,450 L361.0,450" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="227.5" y="443" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">cursor = window end - only after the batches are written</text>
<rect x="60" y="478" width="1160" height="30" rx="5" fill="#f6f8fa" stroke="#9a6700" stroke-width="1"/>
<text x="640.0" y="498" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">HTTP 429 or 5xx stops the run without moving the cursor; the next run resumes from the same point.</text>
</svg>