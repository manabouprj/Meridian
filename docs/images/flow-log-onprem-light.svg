<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="544" viewBox="0 0 1280 544" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Ingestion flow - Windows and Linux on premises over TLS syslog</title><desc id="d">Windows events reach MERIDIAN without an agent on each server: Windows Event Forwarding to a collector, NXLog to the TLS syslog receiver.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect width="1280" height="544" fill="#ffffff"/>
<text x="32" y="40" font-size="20" font-weight="750" fill="#1f2328" text-anchor="start" xml:space="preserve">Ingestion flow - Windows and Linux on premises over TLS syslog</text>
<rect x="12.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="90.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Windows server</text>
<text x="90.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">(Security, Sysmon)</text>
<line x1="90.0" y1="98" x2="90.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="232.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="310.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">WEC + NXLog</text>
<text x="310.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">(collector)</text>
<line x1="310.0" y1="98" x2="310.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="452.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="530.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">MERIDIAN</text>
<text x="530.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">syslog (TLS)</text>
<line x1="530.0" y1="98" x2="530.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="672.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="750.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Landing</text>
<text x="750.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">zone</text>
<line x1="750.0" y1="98" x2="750.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="892.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="970.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Ingestion</text>
<text x="970.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">worker</text>
<line x1="970.0" y1="98" x2="970.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="1112.0" y="58" width="156" height="40" rx="6" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="1190.0" y="68" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">Lake +</text>
<text x="1190.0" y="83" font-size="12" font-weight="650" fill="#1f2328" text-anchor="middle" xml:space="preserve">detection</text>
<line x1="1190.0" y1="98" x2="1190.0" y2="524" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M90.0,128 L306.0,128" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="200.0" y="121" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">WEF subscription (Kerberos, HTTP 5985, encrypted): ForwardedEvents</text>
<path d="M310.0,166 h40 v18 h-36" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="358.0" y="178" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">im_msvistalog -&gt; to_json(); query filters to the event IDs you use</text>
<path d="M310.0,220 L526.0,220" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="420.0" y="213" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">om_ssl to 6514: mutual TLS (client certificate from the internal CA)</text>
<path d="M530.0,258 h40 v18 h-36" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="578.0" y="270" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">buffer; flush every 30 s or 20,000 lines; storage outage = retry, not loss</text>
<path d="M530.0,312 L746.0,312" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="640.0" y="305" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">syslog/&lt;yyyy&gt;/&lt;mm&gt;/&lt;dd&gt;/&lt;batch&gt;.log.gz</text>
<path d="M750.0,358 L966.0,358" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="860.0" y="351" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">queue message (Event Grid / S3 event) -&gt; worker</text>
<path d="M970.0,396 h40 v18 h-36" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1018.0" y="408" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">syslog -&gt; JSON -&gt; windows mapper; local time -&gt; UTC</text>
<path d="M970.0,450 L1186.0,450" fill="none" stroke="#6e7781" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="1080.0" y="443" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle" xml:space="preserve">OCSF-flat Parquet; Sigma rules (process_creation, auditlogs, ...) -&gt; alerts</text>
<rect x="60" y="478" width="1160" height="30" rx="5" fill="#f6f8fa" stroke="#9a6700" stroke-width="1"/>
<text x="640.0" y="498" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">Linux hosts use rsyslog / syslog-ng with TLS to the same port; network devices send to a local relay.</text>
</svg>