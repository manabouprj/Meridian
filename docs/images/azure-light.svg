<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">MERIDIAN on Microsoft Azure + Microsoft Foundry</title><desc id="d">Deployment of MERIDIAN on Microsoft Azure + Microsoft Foundry: private networking, managed identities, landing and lake storage, queue-driven workers, PostgreSQL, model endpoint and the agent / approval path.</desc>
