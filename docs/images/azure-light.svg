<text x="730" y="249" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">(VM / ACI on VNet)</text>
<text x="72" y="292" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">User-assigned managed identity (no keys): Blob Data Contributor, Queue Processor, Key Vault Secrets User, Azure AI User</text>
<text x="72" y="312" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">Internal ingress -&gt; Application Gateway WAF / Front Door Premium (Private Link) for users</text>
<text x="72" y="332" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">Key Vault (RBAC, purge protection) holds API keys, session, ingest, EDL, metrics, OIDC, LODESTAR secrets</text>
<rect x="56" y="380" width="828" height="200" rx="8" fill="#eef1f4" stroke="#d1d9e0" stroke-width="1"/>
<text x="72" y="402" font-size="13" font-weight="650" fill="#1f2328" text-anchor="start" xml:space="preserve">Data</text>
