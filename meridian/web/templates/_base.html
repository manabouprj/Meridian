<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}MERIDIAN{% endblock %}</title>
<style>
:root{--bg:#0b1016;--panel:#121a23;--panel2:#18222d;--line:#263342;--ink:#e6edf3;--ink2:#9fb0c2;--ink3:#6b7d90;
--crit:#ff5c6c;--high:#ff9d4d;--med:#f2c94c;--low:#5cc8ff;--ok:#3fb950;--brand:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:#0e151d;position:sticky;top:0;z-index:2}
header b{font-size:16px;letter-spacing:.08em}header .sub{color:var(--ink3)}header .me{margin-left:auto;color:var(--ink2)}
main{padding:20px;max-width:1400px;margin:0 auto}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}.kpi .v{font-size:26px;font-weight:700}.kpi .l{color:var(--ink3);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink3);font-weight:600;font-size:12px;background:var(--panel2)}
tr:last-child td{border-bottom:none}.wrap{overflow-x:auto}
.sev{display:inline-block;min-width:66px;text-align:center;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:600}
.s5,.s6{background:#3a1218;color:var(--crit)}.s4{background:#3a2412;color:var(--high)}.s3{background:#352e10;color:var(--med)}.s2,.s1,.s0{background:#0f2a3a;color:var(--low)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11px;color:var(--ink2);margin:1px}
.muted{color:var(--ink3)}button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer}
button.ok{border-color:#2b6f3a;color:var(--ok)}button.no{border-color:#6f2b33;color:var(--crit)}
pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:340px;overflow:auto;font-size:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}.note .h{color:var(--ink3);font-size:12px;margin-bottom:4px}
</style>
<script>
function csrf(){const m=document.cookie.match(/(?:^|; )meridian_csrf=([^;]+)/);return m?decodeURIComponent(m[1]):"";}
async function decide(id,d){if(!confirm((d==="approve"?"Approve and EXECUTE ":"Reject ")+id+"?"))return;
 const r=await fetch(`/api/approvals/${encodeURIComponent(id)}/${d}`,{method:"POST",headers:{"X-CSRF-Token":csrf()}});
 const j=await r.json().catch(()=>({}));alert(r.ok?`${j.status}${j.result&&j.result.dry_run?" (dry run)":""}`:(j.detail||r.status));location.reload();}
</script></head>
<body><header><b>MERIDIAN</b><span class="sub">{{ org }} · detection, investigation &amp; response</span>
<span class="me">{{ me.actor }} · {{ me.role }} · <a href="/logout">sign out</a></span></header>
<main>{% block body %}{% endblock %}<p class="muted" style="margin-top:30px">MERIDIAN {{ version }} · agents inform and request; people decide.</p></main></body></html>
